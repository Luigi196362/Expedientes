<div class="container">
    <section class="left-section" [ngClass]="isDarkTheme ? 'dark' : 'light'">

        <div class="logo-container">
            <!-- <img class="logo" src="assets/img/logo.png" /> -->
            <label class="logo-title">Universidad Veracruzana</label>
        </div>
    </section>


    <section class="right-section" [ngClass]="isDarkTheme ? 'dark' : 'light'">

        <!-- <mat-slide-toggle (change)="toggleDarkTheme($event.checked)" [checked]="isDarkTheme"
            class="theme-toggle-container">
            <mat-icon class="theme-toggle" [ngClass]="isDarkTheme ? 'dark' : 'light'">
                dark_mode
            </mat-icon>
        </mat-slide-toggle> -->

        <section></section>


        <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
            <h1 class="login-title" [ngClass]="isDarkTheme ? 'dark':'white'">Inicio de sesión</h1>

            <div *ngIf="errorMessage" class="error-container">
                <mat-icon>error_outline</mat-icon>
                <span class="error-message">{{ errorMessage }}</span>
            </div>

            <mat-form-field class="form-field">
                <mat-label>Nombre de usuario</mat-label>
                <input matInput [(ngModel)]="loginData.username" name="username" required>
            </mat-form-field>

            <mat-form-field class="form-field">
                <mat-label>Ingresa la contraseña</mat-label>
                <input matInput [(ngModel)]="loginData.password" name="password" type="password" required>
                <!-- [type]="hide() ? 'password' : 'text'" -->
                <!-- <button mat-icon-button matSuffix type="button" (click)="clickEvent($event)"
                    [attr.aria-label]="'Hide password'"> -->
                     <!-- [attr.aria-pressed]="hide()" -->
                    <!-- <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon> -->
                <!-- </button> -->
            </mat-form-field>

            <button type="submit" mat-flat-button color="accent" [disabled]="loginForm.invalid">Iniciar sesión</button>
        </form>
    </section>
</div>
