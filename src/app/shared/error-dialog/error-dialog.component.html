<h2 mat-dialog-title style="color: red;">Error</h2>
<mat-dialog-content>
    <p>{{ data.message }}</p>
    <ul *ngIf="data.details && data.details.length > 0">
        <li *ngFor="let detail of data.details" style="text-align: left;">{{ detail }}</li>
    </ul>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close cdkFocusInitial color="accent">Aceptar</button>
</mat-dialog-actions>
